<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B8B',
                        secondary: '#FFB6C1',
                        accent: '#FF85A2',
                        light: '#FFF0F5',
                        dark: '#4A4A4A'
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                        'wiggle': 'wiggle 0.5s ease-in-out infinite',
                        'fall': 'fall 4s linear forwards',
                        'pop': 'pop 0.3s ease-out'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' }
                        },
                        fall: {
                            '0%': { transform: 'translateY(-100px) rotate(0deg)', opacity: 1 },
                            '100%': { transform: 'translateY(100vh) rotate(360deg)', opacity: 0 }
                        },
                        pop: {
                            '0%': { transform: 'scale(0)' },
                            '50%': { transform: 'scale(1.2)' },
                            '100%': { transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(255, 107, 139, 0.2), 0 8px 10px -6px rgba(255, 107, 139, 0.1);
            }
            .gradient-bg {
                background: linear-gradient(135deg, #FFB6C1 0%, #FF6B8B 100%);
            }
            .glass-effect {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .perspective-1000 {
                perspective: 1000px;
            }
            .transform-style-preserve-3d {
                transform-style: preserve-3d;
            }
            .backface-hidden {
                backface-visibility: hidden;
            }
            .rotateY-180 {
                transform: rotateY(180deg);
            }
            .heart-clickable {
                position: absolute;
                z-index: 9999;
                pointer-events: auto;
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                will-change: transform;
                user-select: none;
                -webkit-user-select: none;
            }
        }
    </style>
</head>
<body class="bg-light min-h-screen font-sans text-dark overflow-x-hidden">
    <!-- 顶部原谅进度条 -->
    <div class="fixed top-0 left-0 w-full h-2 bg-gray-200 z-50">
        <div id="forgiveness-bar" class="gradient-bg h-full transition-all duration-500" style="width: 0%"></div>
    </div>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8 pt-12">
        <!-- 欢迎卡片 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow transform hover:scale-[1.02] transition-all duration-300">
            <div class="flex items-center mb-4">
                <div class="w-16 h-16 rounded-full gradient-bg flex items-center justify-center text-white text-3xl animate-float mr-4">
                    <i class="fa fa-heart"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-primary">别生气啦~</h2>
                    <p class="text-gray-600">完成下面的小游戏，消消气</p>
                </div>
            </div>
            <div class="text-center">
                <p class="text-2xl font-bold text-primary mb-1">
                    <span id="forgiveness-percent">0</span>%
                </p>
                <p class="text-sm text-gray-500">原谅度</p>
            </div>
        </div>

        <!-- 游戏1: 幸运抽卡 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-gift mr-2"></i> 幸运抽卡
            </h3>
            <div class="flex justify-center mb-4">
                <div id="card-container" class="w-48 h-64 perspective-1000">
                    <div id="card" class="w-full h-full relative transform-style-preserve-3d transition-transform duration-700 cursor-pointer">
                        <div class="card-front absolute w-full h-full backface-hidden rounded-2xl gradient-bg flex items-center justify-center text-white text-4xl shadow-lg">
                            <i class="fa fa-gift"></i>
                        </div>
                        <div id="card-back" class="card-back absolute w-full h-full backface-hidden rounded-2xl bg-white flex flex-col items-center justify-center p-4 shadow-lg rotateY-180">
                            <p id="card-content" class="text-center text-lg mb-4">点击卡片抽取你的奖励</p>
                            <button id="reset-card" class="text-primary text-sm hover:underline">再抽一次</button>
                        </div>
                    </div>
                </div>
            </div>
            <p class="text-center text-gray-500 text-sm">点击卡片，抽取一个专属奖励吧~</p>
        </div>

        <!-- 游戏2: 打地鼠消气 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-bug mr-2"></i> 打地鼠消气
            </h3>
            <p class="text-center text-gray-500 text-sm mb-4">点击生气的表情，把它们变成开心的表情！</p>
            <div class="grid grid-cols-3 gap-4 mb-4" id="mole-grid">
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="0">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="1">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="2">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="3">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="4">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="5">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="6">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="7">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="8">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
            </div>
            <div class="text-center">
                <p class="text-sm text-gray-500">已消除: <span id="mole-count">0</span>/10 个生气表情</p>
            </div>
        </div>

        <!-- 游戏3: 爱心收集 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-heart mr-2"></i> 爱心收集
            </h3>
            <p class="text-center text-gray-500 text-sm mb-4">点击飘落的爱心，收集满10个获得惊喜！</p>
            <div id="hearts-game-area" class="relative bg-white rounded-xl h-40 mb-4 overflow-hidden">
                <!-- 爱心将通过JS动态生成 -->
            </div>
            <div class="text-center">
                <p class="text-sm text-gray-500">已收集: <span id="heart-count">0</span>/10 个爱心</p>
            </div>
        </div>

        <!-- 游戏4: 真心话大冒险 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-gamepad mr-2"></i> 真心话大冒险
            </h3>
            <div class="bg-white rounded-xl p-5 min-h-[100px] flex items-center justify-center text-center mb-4 shadow-inner">
                <p id="truth-dare-content">点击下方按钮开始游戏</p>
            </div>
            <div class="flex space-x-3">
                <button id="truth-btn" class="flex-1 gradient-bg text-white py-3 rounded-xl font-medium hover:opacity-90 transition-all">
                    真心话
                </button>
                <button id="dare-btn" class="flex-1 bg-secondary text-white py-3 rounded-xl font-medium hover:opacity-90 transition-all">
                    大冒险
                </button>
            </div>
        </div>

        <!-- 完成庆祝 -->
        <div id="celebration" class="hidden glass-effect rounded-2xl p-8 card-shadow text-center">
            <div class="text-6xl text-primary mb-4 animate-bounce-slow">
                <i class="fa fa-heart"></i>
            </div>
            <h2 class="text-2xl font-bold text-primary mb-2">🎉 恭喜你！</h2>
            <p class="text-lg mb-4">对不起宝宝~</p>
            <p class="text-gray-600">可不可以原谅我🥹</p>
        </div>
    </main>

    <!-- 全局爱心背景 -->
    <div id="hearts-background" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- 提示框 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-dark text-white px-6 py-3 rounded-full shadow-lg opacity-0 transition-opacity duration-300 z-50">
        提示信息
    </div>

    <script>
        // 游戏数据
        const cardRewards = [
            "获得一个抱抱 🤗",
            "获得一个亲亲 😘",
            "获得一次免生气卡 🎫",
            "获得一顿大餐 🍔",
            "获得一次按摩服务 💆",
            "获得一个愿望 ✨",
            "获得一天女王特权 👑",
            "获得一次逛街陪逛服务 🛍️",
            "获得一个惊喜礼物 🎁",
            "获得一次电影票 🎬"
        ];

        const truthQuestions = [
            "你最喜欢我什么地方？",
            "你第一次见我是什么感觉？",
            "你有没有想过和我结婚？",
            "你最想和我一起做什么事情？",
            "你觉得我最大的优点是什么？",
            "你希望我为你做什么？",
            "如果可以改变我的一个地方，你想改变什么？",
            "每次惹你生气的时候，你心里在想什么？",
            "你最想对我说的一句话是什么？",
            "你觉得我们在一起最幸福的时刻是什么时候？"
        ];

        const dareTasks = [
            "给你唱歌",
            "对你说十句我爱你",
            "做一个鬼脸给你看",
            "学狗叫三声",
            "给你一个公主抱",
            "亲你一下",
            "给你按摩肩膀五分钟",
            "为你弹琴",
            "你想我做什么，我就做什么",
            "给你跳一段舞"
        ];

        // DOM元素
        const forgivenessBar = document.getElementById('forgiveness-bar');
        const forgivenessPercent = document.getElementById('forgiveness-percent');
        const card = document.getElementById('card');
        const cardContent = document.getElementById('card-content');
        const resetCardBtn = document.getElementById('reset-card');
        const moleHoles = document.querySelectorAll('.mole-hole');
        const moleCount = document.getElementById('mole-count');
        const heartsGameArea = document.getElementById('hearts-game-area');
        const heartCount = document.getElementById('heart-count');
        const truthBtn = document.getElementById('truth-btn');
        const dareBtn = document.getElementById('dare-btn');
        const truthDareContent = document.getElementById('truth-dare-content');
        const shakeMessage = document.getElementById('shake-message');
        const toast = document.getElementById('toast');
        const celebration = document.getElementById('celebration');
        const heartsBackground = document.getElementById('hearts-background');

        // 游戏状态
        let forgiveness = 0;
        let moleEliminated = 0;
        let heartsCollected = 0;
        let moleInterval;
        let heartInterval;
        let lastShakeTime = 0;
        let isCardFlipping = false; // 抽卡翻转状态锁
        let activeHearts = []; // 活跃的爱心列表

        // 初始化
        function init() {
            // 事件监听
            card.addEventListener('click', flipCard);
            resetCardBtn.addEventListener('click', resetCard);
            
            moleHoles.forEach(hole => {
                hole.addEventListener('click', hitMole);
            });
            
            truthBtn.addEventListener('click', () => {
                const question = truthQuestions[Math.floor(Math.random() * truthQuestions.length)];
                truthDareContent.textContent = question;
                increaseForgiveness(5);
            });
            
            dareBtn.addEventListener('click', () => {
                const task = dareTasks[Math.floor(Math.random() * dareTasks.length)];
                truthDareContent.textContent = task;
                increaseForgiveness(5);
            });

            // 爱心收集事件（同时支持鼠标和触摸）
            heartsGameArea.addEventListener('mousedown', handleHeartClick);
            heartsGameArea.addEventListener('touchstart', handleHeartClick, { passive: false });
            
            // 启动打地鼠游戏
            startMoleGame();
            
            // 启动爱心收集游戏
            startHeartGame();
            
            // 生成背景爱心
            setInterval(createBackgroundHeart, 2000);
        }

        // 增加原谅度
        function increaseForgiveness(amount) {
            if (forgiveness >= 100) return;
            
            forgiveness = Math.min(forgiveness + amount, 100);
            forgivenessBar.style.width = `${forgiveness}%`;
            forgivenessPercent.textContent = forgiveness;
            
            // 原谅度达到100%时的庆祝效果
            if (forgiveness === 100) {
                showToast('🎉 恭喜！我已经完全原谅你啦！');
                celebration.classList.remove('hidden');
                
                // 生成大量爱心
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        createBackgroundHeart();
                    }, i * 50);
                }
                
                // 停止所有游戏
                clearInterval(moleInterval);
                clearInterval(heartInterval);

                // 停止所有爱心动画
                activeHearts.forEach(heart => {
                    cancelAnimationFrame(heart.animationId);
                    if (heart.element.parentNode) {
                        heart.element.remove();
                    }
                });
                activeHearts = [];
            }
        }

        // 抽卡游戏
        function flipCard() {
            if (isCardFlipping || card.classList.contains('flipped')) return;
            
            isCardFlipping = true;
            
            // 先更新内容，再翻转
            const reward = cardRewards[Math.floor(Math.random() * cardRewards.length)];
            cardContent.textContent = reward;
            
            // 翻转卡片
            card.classList.add('flipped');
            card.style.transform = 'rotateY(180deg)';
            
            // 增加原谅度
            increaseForgiveness(10);
            
            // 翻转完成后解锁
            setTimeout(() => {
                isCardFlipping = false;
            }, 700);
        }

        function resetCard(e) {
            e.stopPropagation();
            
            if (isCardFlipping || !card.classList.contains('flipped')) return;
            
            isCardFlipping = true;
            
            // 翻转回来
            card.classList.remove('flipped');
            card.style.transform = 'rotateY(0deg)';
            
            // 翻转完成后再更新内容
            setTimeout(() => {
                cardContent.textContent = '点击卡片抽取你的奖励';
                isCardFlipping = false;
            }, 700);
        }

        // 打地鼠游戏
        function startMoleGame() {
            moleInterval = setInterval(() => {
                if (forgiveness >= 100) return;
                
                // 随机选择一个洞
                const randomIndex = Math.floor(Math.random() * moleHoles.length);
                const hole = moleHoles[randomIndex];
                
                // 如果这个洞已经有生气表情了，就跳过
                if (hole.querySelector('.fa-frown-o')) return;
                
                // 显示生气表情
                hole.innerHTML = '<i class="fa fa-frown-o text-primary animate-pop"></i>';
                hole.dataset.active = 'true';
                
                // 3秒后自动消失
                setTimeout(() => {
                    if (hole.dataset.active === 'true') {
                        hole.innerHTML = '<i class="fa fa-meh-o text-gray-400"></i>';
                        hole.dataset.active = 'false';
                    }
                }, 3000);
            }, 1000);
        }

        // 打地鼠游戏
        function hitMole(e) {
            const hole = e.currentTarget;
            
            if (hole.dataset.active === 'true') {
                // 变成开心表情
                hole.innerHTML = '<i class="fa fa-smile-o text-green-500 animate-pop"></i>';
                hole.dataset.active = 'false';
                
                // 增加计数
                moleEliminated++;
                moleCount.textContent = moleEliminated;
                
                // 增加原谅度
                increaseForgiveness(2);
                
                // 1秒后恢复
                setTimeout(() => {
                    hole.innerHTML = '<i class="fa fa-meh-o text-gray-400"></i>';
                }, 1000);
            }
        }

        // 爱心收集游戏
        function startHeartGame() {
            heartInterval = setInterval(() => {
                if (forgiveness >= 100) return;
                
                createGameHeart();
            }, 1500);
        }

        function createGameHeart() {
            const heartContainer = document.createElement('div');
            heartContainer.className = 'heart-clickable';
            heartContainer.style.left = `${Math.random() * 70 + 15}%`;
            heartContainer.style.top = '-50px';
            
            const heartIcon = document.createElement('i');
            heartIcon.className = 'fa fa-heart text-primary text-2xl';
            heartContainer.appendChild(heartIcon);
            
            heartsGameArea.appendChild(heartContainer);
            
            // 爱心动画数据
            const heartData = {
                element: heartContainer,
                y: -50,
                speed: 0.8 + Math.random() * 0.4,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 2,
                animationId: null
            };
            
            activeHearts.push(heartData);
            
            // 启动动画
            function animateHeart() {
                heartData.y += heartData.speed;
                heartData.rotation += heartData.rotationSpeed;
                
                heartContainer.style.transform = `translateY(${heartData.y}px) rotate(${heartData.rotation}deg)`;
                
                // 如果爱心超出底部，移除
                if (heartData.y > 200) {
                    cancelAnimationFrame(heartData.animationId);
                    if (heartContainer.parentNode) {
                        heartContainer.remove();
                    }
                    const index = activeHearts.indexOf(heartData);
                    if (index > -1) {
                        activeHearts.splice(index, 1);
                    }
                    return;
                }
                
                heartData.animationId = requestAnimationFrame(animateHeart);
            }
            
            heartData.animationId = requestAnimationFrame(animateHeart);
        }

        function handleHeartClick(e) {
            e.preventDefault();
            
            // 获取点击坐标
            let clientX, clientY;
            if (e.type === 'touchstart') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            // 检查是否点击了任何爱心
            for (let i = activeHearts.length - 1; i >= 0; i--) {
                const heartData = activeHearts[i];
                const rect = heartData.element.getBoundingClientRect();
                
                // 检查点击是否在爱心范围内
                if (clientX >= rect.left && clientX <= rect.right &&
                    clientY >= rect.top && clientY <= rect.bottom) {
                    
                    // 停止动画
                    cancelAnimationFrame(heartData.animationId);
                    
                    // 移除爱心
                    heartData.element.remove();
                    activeHearts.splice(i, 1);
                    
                    // 增加计数和原谅度
                    heartsCollected++;
                    heartCount.textContent = heartsCollected;
                    increaseForgiveness(3);
                    showToast('+1 爱心');
                    
                    return;
                }
            }
        }

        // 背景爱心
        function createBackgroundHeart() {
            const heart = document.createElement('div');
            heart.className = 'absolute text-primary opacity-30 animate-fall';
            heart.innerHTML = '<i class="fa fa-heart"></i>';
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.fontSize = `${Math.random() * 20 + 10}px`;
            heart.style.animationDuration = `${Math.random() * 5 + 5}s`;
            
            heartsBackground.appendChild(heart);
            
            // 动画结束后移除
            setTimeout(() => {
                heart.remove();
            }, 10000);
        }

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
