<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B8B',
                        secondary: '#FFB6C1',
                        accent: '#FF85A2',
                        light: '#FFF0F5',
                        dark: '#4A4A4A'
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'pop': 'pop 0.3s ease-out',
                        'fade-in': 'fadeIn 1s ease forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        pop: {
                            '0%': { transform: 'scale(0)' },
                            '50%': { transform: 'scale(1.2)' },
                            '100%': { transform: 'scale(1)' }
                        },
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(255, 107, 139, 0.2), 0 8px 10px -6px rgba(255, 107, 139, 0.1);
            }
            .gradient-bg {
                background: linear-gradient(135deg, #FFB6C1 0%, #FF6B8B 100%);
            }
            .glass-effect {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .perspective-1000 {
                perspective: 1000px;
            }
            .transform-style-preserve-3d {
                transform-style: preserve-3d;
            }
            .backface-hidden {
                backface-visibility: hidden;
            }
            .rotateY-180 {
                transform: rotateY(180deg);
            }
            .heart-clickable {
                position: absolute;
                z-index: 9999;
                pointer-events: auto;
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                will-change: transform;
                user-select: none;
                -webkit-user-select: none;
            }
            /* 强制初始隐藏，最高优先级 */
            .end-panel {
                position: fixed;
                inset: 0;
                z-index: 999;
                display: none !important;
                align-items: center;
                justify-content: center;
                background: rgba(255, 240, 245, 0.92);
            }
            .end-panel.show {
                display: flex !important;
            }
        }
    </style>
</head>
<body class="bg-light min-h-screen font-sans text-dark overflow-x-hidden">
    <!-- 顶部原谅进度条 -->
    <div class="fixed top-0 left-0 w-full h-2 bg-gray-200 z-50">
        <div id="forgiveness-bar" class="gradient-bg h-full transition-all duration-500" style="width: 0%"></div>
    </div>

    <!-- 主游戏区域 -->
    <main id="game-main" class="container mx-auto px-4 py-8 pt-12">
        <!-- 欢迎卡片 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow transform hover:scale-[1.02] transition-all duration-300">
            <div class="flex items-center mb-4">
                <div class="w-16 h-16 rounded-full gradient-bg flex items-center justify-center text-white text-3xl animate-float mr-4">
                    <i class="fa fa-heart"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-primary">别生气啦~</h2>
                    <p class="text-gray-600">完成下面的小游戏，消消气</p>
                </div>
            </div>
            <div class="text-center">
                <p class="text-2xl font-bold text-primary mb-1">
                    <span id="forgiveness-percent">0</span>%
                </p>
                <p class="text-sm text-gray-500">原谅度</p>
            </div>
        </div>

        <!-- 幸运抽卡 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-gift mr-2"></i> 幸运抽卡
            </h3>
            <div class="flex justify-center mb-4">
                <div id="card-container" class="w-48 h-64 perspective-1000">
                    <div id="card" class="w-full h-full relative transform-style-preserve-3d transition-transform duration-700 cursor-pointer">
                        <div class="card-front absolute w-full h-full backface-hidden rounded-2xl gradient-bg flex items-center justify-center text-white text-4xl shadow-lg">
                            <i class="fa fa-gift"></i>
                        </div>
                        <div id="card-back" class="card-back absolute w-full h-full backface-hidden rounded-2xl bg-white flex flex-col items-center justify-center p-4 shadow-lg rotateY-180">
                            <p id="card-content" class="text-center text-lg mb-4">点击卡片抽取你的奖励</p>
                            <button id="reset-card" class="text-primary text-sm hover:underline">再抽一次</button>
                        </div>
                    </div>
                </div>
            </div>
            <p class="text-center text-gray-500 text-sm">点击卡片，抽取一个专属奖励吧~</p>
        </div>

        <!-- 打地鼠消气 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-bug mr-2"></i> 打地鼠消气
            </h3>
            <p class="text-center text-gray-500 text-sm mb-4">点击生气的表情，把它们变成开心的表情！</p>
            <div class="grid grid-cols-3 gap-4 mb-4" id="mole-grid">
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="0">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="1">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="2">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="3">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="4">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="5">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="6">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="7">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
                <div class="mole-hole bg-white rounded-xl h-20 flex items-center justify-center text-4xl cursor-pointer" data-index="8">
                    <i class="fa fa-meh-o text-gray-400"></i>
                </div>
            </div>
            <div class="text-center">
                <p class="text-sm text-gray-500">已消除: <span id="mole-count">0</span>/10 个生气表情</p>
            </div>
        </div>

        <!-- 爱心收集 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-heart mr-2"></i> 爱心收集
            </h3>
            <p class="text-center text-gray-500 text-sm mb-4">点击飘落的爱心，收集满10个获得惊喜！</p>
            <div id="hearts-game-area" class="relative bg-white rounded-xl h-40 mb-4 overflow-hidden"></div>
            <div class="text-center">
                <p class="text-sm text-gray-500">已收集: <span id="heart-count">0</span>/10 个爱心</p>
            </div>
        </div>

        <!-- 真心话大冒险 -->
        <div class="glass-effect rounded-2xl p-6 mb-8 card-shadow">
            <h3 class="text-lg font-bold mb-4 text-primary flex items-center">
                <i class="fa fa-gamepad mr-2"></i> 真心话大冒险
            </h3>
            <div class="bg-white rounded-xl p-5 min-h-[100px] flex items-center justify-center text-center mb-4 shadow-inner">
                <p id="truth-dare-content">点击下方按钮开始游戏</p>
            </div>
            <div class="flex space-x-3">
                <button id="truth-btn" class="flex-1 gradient-bg text-white py-3 rounded-xl font-medium hover:opacity-90 transition-all">
                    真心话
                </button>
                <button id="dare-btn" class="flex-1 bg-secondary text-white py-3 rounded-xl font-medium hover:opacity-90 transition-all">
                    大冒险
                </button>
            </div>
        </div>

        <!-- 短时庆祝提示 -->
        <div id="celebration" class="hidden glass-effect rounded-2xl p-8 card-shadow text-center mx-4">
            <div class="text-6xl text-primary mb-4 animate-bounce-slow">
                <i class="fa fa-heart"></i>
            </div>
            <h2 class="text-2xl font-bold text-primary mb-2">🎉 恭喜你！</h2>
            <p class="text-lg mb-4">对不起宝宝~</p>
            <p class="text-gray-600">可不可以原谅我🥹</p>
        </div>
    </main>

    <!-- 收尾页面：初始强制隐藏 -->
    <div id="finalEndPanel" class="end-panel">
        <div class="glass-effect rounded-3xl p-10 card-shadow text-center max-w-md w-full mx-6 animate-fade-in">
            <div class="text-7xl text-primary mb-6 animate-bounce-slow">
                <i class="fa fa-heart"></i>
            </div>
            <h2 class="text-3xl font-bold text-primary mb-4">进度到达100%💖</h2>
            <p id="endText" class="text-lg text-gray-700 min-h-[60px] mb-6 leading-relaxed">有消气嘛</p>
            <div class="space-y-4">
                <button id="restartBtn" class="w-full gradient-bg text-white py-4 rounded-xl text-lg font-medium hover:opacity-90 transition-all">
                    再玩一次
                </button>
            </div>
            <p class="text-sm text-gray-500 mt-6">开开心心好不好</p>
        </div>
    </div>

    <!-- 全局爱心背景 -->
    <div id="hearts-background" class="fixed inset-0 pointer-events-none z-0"></div>
    <!-- 提示框 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-dark text-white px-6 py-3 rounded-full shadow-lg opacity-0 transition-opacity duration-300 z-50">提示信息</div>

    <script>
        // 【修复核心】重新添加所有关键数组定义
        const cardRewards = [
            "获得一个抱抱 🤗",
            "获得一个亲亲 😘",
            "获得一次免生气卡 🎫",
            "获得一顿大餐 🍔",
            "获得一次按摩服务 💆",
            "获得一个愿望 ✨",
            "获得一天女王特权 👑",
            "获得一次逛街陪逛服务 🛍️",
            "获得一个惊喜礼物 🎁",
            "获得一次电影票 🎬"
        ];

        const truthQuestions = [
            "你最喜欢我什么地方？",
            "你第一次见我是什么感觉？",
            "你有没有想过和我结婚？",
            "你最想和我一起做什么事情？",
            "你觉得我最大的优点是什么？",
            "你希望我为你做什么？",
            "如果可以改变我的一个地方，你想改变什么？",
            "每次惹你生气的时候，你心里在想什么？",
            "你最想对我说的一句话是什么？",
            "你觉得我们在一起最幸福的时刻是什么时候？"
        ];

        const dareTasks = [
            "给你唱歌",
            "一直说喜欢你喜欢你喜欢你",
            "做一个鬼脸给你看",
            "学狗叫三声",
            "给你一个公主抱",
            "亲你一下",
            "给你按摩肩膀五分钟",
            "为你弹琴",
            "你想我做什么，我就做什么",
            "给你跳一段舞"
        ];

        const endWords = [
            "所有不愉快都烟消云散啦",
            "大人有大量",
            "不跟我生气了",
            "和好嘛和好嘛",
            "开心万岁，岁岁年年都相伴"
        ];
        let textIndex = 0;
        let textTimer = null; // 文案轮播定时器

        // DOM 节点
        const forgivenessBar = document.getElementById('forgiveness-bar');
        const forgivenessPercent = document.getElementById('forgiveness-percent');
        const card = document.getElementById('card');
        const cardContent = document.getElementById('card-content');
        const resetCardBtn = document.getElementById('reset-card');
        const moleHoles = document.querySelectorAll('.mole-hole');
        const moleCount = document.getElementById('mole-count');
        const heartsGameArea = document.getElementById('hearts-game-area');
        const heartCount = document.getElementById('heart-count');
        const truthBtn = document.getElementById('truth-btn');
        const dareBtn = document.getElementById('dare-btn');
        const truthDareContent = document.getElementById('truth-dare-content');
        const toast = document.getElementById('toast');
        const celebration = document.getElementById('celebration');
        const heartsBackground = document.getElementById('hearts-background');
        const gameMain = document.getElementById('game-main');
        const finalEndPanel = document.getElementById('finalEndPanel');
        const restartBtn = document.getElementById('restartBtn');
        const endText = document.getElementById('endText');

        // 游戏状态【全部强制初始化】
        let forgiveness = 0;
        let moleEliminated = 0;
        let heartsCollected = 0;
        let moleInterval = null;
        let heartInterval = null;
        let bgHeartInterval = null;
        let isCardFlipping = false;
        let activeHearts = [];

        // 切换收尾文案
        function switchEndText() {
            textIndex = (textIndex + 1) % endWords.length;
            endText.textContent = endWords[textIndex];
        }

        // 显示提示
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // 增加原谅度
        function increaseForgiveness(amount) {
            if (forgiveness >= 100) return;
            forgiveness = Math.min(forgiveness + amount, 100);
            forgivenessBar.style.width = forgiveness + '%';
            forgivenessPercent.textContent = forgiveness;

            // 仅当刚好到100%时触发收尾流程
            if (forgiveness === 100) {
                showToast('🎉 恭喜！我已经完全原谅你啦！');
                celebration.classList.remove('hidden');

                // 生成庆祝爱心
                for (let i = 0; i < 50; i++) {
                    setTimeout(createBackgroundHeart, i * 50);
                }

                // 停止所有游戏
                clearInterval(moleInterval);
                clearInterval(heartInterval);
                activeHearts.forEach(h => {
                    cancelAnimationFrame(h.animationId);
                    h.element && h.element.remove();
                });
                activeHearts = [];

                // 延迟跳转收尾页
                setTimeout(() => {
                    celebration.classList.add('hidden');
                    gameMain.classList.add('hidden');
                    finalEndPanel.classList.add('show');
                    // 进入收尾页再开启文案轮播
                    textTimer = setInterval(switchEndText, 3000);
                }, 3000);
            }
        }

        // 【修复抽卡】正确引用cardRewards数组
        function flipCard() {
            if (isCardFlipping || card.classList.contains('flipped')) return;
            isCardFlipping = true;
            const reward = cardRewards[Math.floor(Math.random() * cardRewards.length)];
            cardContent.textContent = reward;
            card.classList.add('flipped');
            card.style.transform = 'rotateY(180deg)';
            increaseForgiveness(10);
            setTimeout(() => isCardFlipping = false, 700);
        }
        function resetCard(e) {
            e.stopPropagation();
            if (isCardFlipping || !card.classList.contains('flipped')) return;
            isCardFlipping = true;
            card.classList.remove('flipped');
            card.style.transform = 'rotateY(0deg)';
            setTimeout(() => {
                cardContent.textContent = '点击卡片抽取你的奖励';
                isCardFlipping = false;
            }, 700);
        }

        // 打地鼠
        function startMoleGame() {
            moleInterval = setInterval(() => {
                if (forgiveness >= 100 || moleEliminated >= 10) {
                    clearInterval(moleInterval);
                    return;
                }
                const idx = Math.floor(Math.random() * moleHoles.length);
                const hole = moleHoles[idx];
                if (hole.dataset.active === 'true') return;
                hole.innerHTML = '<i class="fa fa-frown-o text-primary animate-pop"></i>';
                hole.dataset.active = 'true';
                setTimeout(() => {
                    if (hole.dataset.active === 'true') {
                        hole.innerHTML = '<i class="fa fa-meh-o text-gray-400"></i>';
                        hole.dataset.active = '';
                    }
                }, 3000);
            }, 1000);
        }
        function hitMole(e) {
            const hole = e.currentTarget;
            if (moleEliminated >= 10) return;
            if (hole.dataset.active === 'true') {
                hole.innerHTML = '<i class="fa fa-smile-o text-green-500 animate-pop"></i>';
                hole.dataset.active = '';
                moleEliminated = Math.min(moleEliminated + 1, 10);
                moleCount.textContent = moleEliminated;
                increaseForgiveness(2);
                setTimeout(() => {
                    hole.innerHTML = '<i class="fa fa-meh-o text-gray-400"></i>';
                }, 1000);
                if (moleEliminated >= 10) {
                    clearInterval(moleInterval);
                    showToast('✅ 打地鼠完成！');
                }
            }
        }

        // 爱心收集
        function startHeartGame() {
            heartInterval = setInterval(() => {
                if (forgiveness >= 100 || heartsCollected >= 10) {
                    clearInterval(heartInterval);
                    return;
                }
                createGameHeart();
            }, 1800);
        }
        function createGameHeart() {
            const container = document.createElement('div');
            container.className = 'heart-clickable';
            container.style.left = (Math.random() * 70 + 15) + '%';
            container.style.top = '-50px';
            container.innerHTML = '<i class="fa fa-heart text-primary text-2xl"></i>';
            heartsGameArea.appendChild(container);

            const data = { element: container, y: -50, speed: 0.7, rot: 0, rotSpd: (Math.random()-0.5)*2, animationId: null };
            activeHearts.push(data);

            function anim() {
                data.y += data.speed;
                data.rot += data.rotSpd;
                container.style.transform = `translateY(${data.y}px) rotate(${data.rot}deg)`;
                if (data.y > 200) {
                    cancelAnimationFrame(data.animationId);
                    container.remove();
                    const i = activeHearts.indexOf(data);
                    if(i > -1) activeHearts.splice(i,1);
                    return;
                }
                data.animationId = requestAnimationFrame(anim);
            }
            data.animationId = requestAnimationFrame(anim);
        }
        function handleHeartClick(e) {
            e.preventDefault();
            if(heartsCollected >= 10) return;
            let x, y;
            if(e.type === 'touchstart'){
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            }else{
                x = e.clientX;
                y = e.clientY;
            }
            for(let i = activeHearts.length - 1; i >= 0; i--){
                const d = activeHearts[i];
                const rect = d.element.getBoundingClientRect();
                if(x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom){
                    cancelAnimationFrame(d.animationId);
                    d.element.remove();
                    activeHearts.splice(i,1);
                    heartsCollected = Math.min(heartsCollected + 1, 10);
                    heartCount.textContent = heartsCollected;
                    increaseForgiveness(3);
                    showToast('+1 爱心');
                    if(heartsCollected >= 10) showToast('✅ 爱心收集完成！');
                    return;
                }
            }
        }

        // 背景爱心
        function createBackgroundHeart() {
            const el = document.createElement('div');
            el.className = 'absolute text-primary opacity-30';
            el.innerHTML = '<i class="fa fa-heart"></i>';
            el.style.left = Math.random()*100 + '%';
            el.style.top = '-30px';
            el.style.fontSize = (Math.random()*20+10) + 'px';
            el.style.transition = 'transform 10s linear';
            heartsBackground.appendChild(el);
            setTimeout(() => {
                el.style.transform = 'translateY(100vh) rotate(360deg)';
                setTimeout(()=>el.remove(),10000);
            },100);
        }

        // 全局重置游戏（再玩一次）
        function resetAllGame() {
            // 清空所有定时器
            clearInterval(moleInterval);
            clearInterval(heartInterval);
            clearInterval(bgHeartInterval);
            clearInterval(textTimer);
            textTimer = null;

            // 重置数值
            forgiveness = 0;
            moleEliminated = 0;
            heartsCollected = 0;
            activeHearts = [];
            isCardFlipping = false;

            // 重置DOM
            forgivenessBar.style.width = '0%';
            forgivenessPercent.textContent = '0';
            moleCount.textContent = '0';
            heartCount.textContent = '0';
            truthDareContent.textContent = '点击下方按钮开始游戏';

            card.classList.remove('flipped');
            card.style.transform = 'rotateY(0deg)';
            cardContent.textContent = '点击卡片抽取你的奖励';

            moleHoles.forEach(h => {
                h.innerHTML = '<i class="fa fa-meh-o text-gray-400"></i>';
                h.dataset.active = '';
            });

            heartsGameArea.innerHTML = '';

            // 隐藏收尾页、恢复主界面
            finalEndPanel.classList.remove('show');
            gameMain.classList.remove('hidden');
            celebration.classList.add('hidden');

            // 重启游戏
            startMoleGame();
            startHeartGame();
            bgHeartInterval = setInterval(createBackgroundHeart, 2500);
            showToast('🔄 游戏已重新开始！');
        }

        // 页面加载完成后，延迟再初始化，彻底避免脚本冲突
        window.addEventListener('DOMContentLoaded', function(){
            // 绑定事件
            card.addEventListener('click', flipCard);
            resetCardBtn.addEventListener('click', resetCard);
            moleHoles.forEach(h => h.addEventListener('click', hitMole));
            truthBtn.addEventListener('click', ()=>{
                const q = truthQuestions[Math.floor(Math.random()*truthQuestions.length)];
                truthDareContent.textContent = q;
                increaseForgiveness(5);
            });
            dareBtn.addEventListener('click', ()=>{
                const t = dareTasks[Math.floor(Math.random()*dareTasks.length)];
                truthDareContent.textContent = t;
                increaseForgiveness(5);
            });
            heartsGameArea.addEventListener('mousedown', handleHeartClick);
            heartsGameArea.addEventListener('touchstart', handleHeartClick, {passive:false});
            restartBtn.addEventListener('click', resetAllGame);

            // 延迟500ms启动游戏，杜绝加载错乱
            setTimeout(()=>{
                startMoleGame();
                startHeartGame();
                bgHeartInterval = setInterval(createBackgroundHeart, 2500);
            }, 500);
        });
    </script>
</body>
</html>
